<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Access Internship</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        accessPurple: "#8A1B78",
                        accessGreen: "#008A4B",
                        navy: "#263750",
                    }
                }
            }
        }
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        .login-bg {
            background:
                radial-gradient(
                    circle at 10% 15%,
                    rgba(138, 27, 120, 0.09),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 90% 85%,
                    rgba(0, 138, 75, 0.09),
                    transparent 28%
                ),
                #f8faf9;
        }

        .login-card {
            box-shadow:
                0 10px 30px rgba(38, 55, 80, 0.07),
                0 2px 8px rgba(38, 55, 80, 0.04);
        }

        .input-focus:focus {
            border-color: #8A1B78;
            box-shadow: 0 0 0 3px rgba(138, 27, 120, 0.08);
            outline: none;
        }

        .login-button {
            background: linear-gradient(
                90deg,
                #008A4B,
                #8A1B78
            );

            transition: all 0.2s ease;
        }

        .login-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(138, 27, 120, 0.18);
        }
    </style>
</head>


<body class="min-h-screen login-bg flex items-center justify-center px-4">


    <!-- LOGIN CARD -->

    <div
        class="login-card
               w-full
               max-w-[380px]
               bg-white
               rounded-3xl
               border border-slate-100
               px-7
               py-6">


        <!-- HEADER -->

        <div class="text-center mb-5">


            <!-- LOGO -->

            <div class="flex justify-center mb-0">

                <img
                    src="assets/images/logo.png"
                    alt="Logo Access Media"
                    class="w-16 h-16 object-contain">

            </div>


            <!-- TITLE -->

            <h1
                class="text-lg
                       font-bold
                       text-navy
                       -mt-1">

                Access Internship

            </h1>


            <!-- SUBTITLE -->

            <p
                class="text-xs
                       text-slate-400
                       mt-1">

                Masuk ke akun Anda

            </p>

        </div>


        <!-- FORM -->

        <form
            action="dashboard.html"
            method="GET"
            class="space-y-4">


            <!-- EMAIL -->

            <div>

                <label
                    for="email"
                    class="block
                           text-xs
                           font-semibold
                           text-navy
                           mb-1.5">

                    Email

                </label>


                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Masukkan email Anda"
                    required
                    class="input-focus
                           w-full
                           h-10
                           px-3
                           rounded-lg
                           border
                           border-slate-200
                           bg-white
                           text-xs
                           text-slate-700
                           placeholder:text-slate-300
                           transition">

            </div>


            <!-- PASSWORD -->

            <div>

                <div
                    class="flex
                           items-center
                           justify-between
                           mb-1.5">

                    <label
                        for="password"
                        class="text-xs
                               font-semibold
                               text-navy">

                        Password

                    </label>


                    <a
                        href="#"
                        class="text-[10px]
                               font-medium
                               text-accessPurple
                               hover:text-accessGreen
                               transition">

                        Lupa password?

                    </a>

                </div>


                <div class="relative">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Masukkan password Anda"
                        required
                        class="input-focus
                               w-full
                               h-10
                               px-3
                               pr-10
                               rounded-lg
                               border
                               border-slate-200
                               bg-white
                               text-xs
                               text-slate-700
                               placeholder:text-slate-300
                               transition">


                    <!-- SHOW PASSWORD -->

                    <button
                        type="button"
                        onclick="togglePassword()"
                        class="absolute
                               right-3
                               top-1/2
                               -translate-y-1/2
                               text-slate-400
                               hover:text-accessPurple
                               transition">

                        <svg
                            id="eyeIcon"
                            class="w-4 h-4"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24">

                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="1.7"
                                d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" />

                            <circle
                                cx="12"
                                cy="12"
                                r="2.5"
                                stroke-width="1.7" />

                        </svg>

                    </button>

                </div>

            </div>


            <!-- REMEMBER ME -->

            <div class="flex items-center gap-2">

                <input
                    type="checkbox"
                    id="remember"
                    name="remember"
                    class="w-3.5 h-3.5
                           rounded
                           border-slate-300
                           text-accessPurple
                           focus:ring-accessPurple">

                <label
                    for="remember"
                    class="text-[10px]
                           text-slate-500">

                    Ingat saya

                </label>

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="login-button
                       w-full
                       h-10
                       rounded-lg
                       text-xs
                       font-semibold
                       text-white
                       mt-2">

                Masuk

            </button>

        </form>


        <!-- FOOTER -->

        <div class="text-center mt-5">

            <p
                class="text-[10px]
                       text-slate-400">

                © 2026 Access Internship

            </p>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script>

        function togglePassword() {

            const password =
                document.getElementById("password");

            const eyeIcon =
                document.getElementById("eyeIcon");


            if (password.type === "password") {

                password.type = "text";

                eyeIcon.innerHTML = `
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="1.7"
                        d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.2A9.7 9.7 0 0 1 12 5c6 0 9.5 7 9.5 7a18 18 0 0 1-3.1 3.9M6.1 6.1C3.9 7.7 2.5 12 2.5 12s3.5 6 9.5 6c1.3 0 2.5-.3 3.6-.8"
                    />
                `;

            } else {

                password.type = "password";

                eyeIcon.innerHTML = `
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="1.7"
                        d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"
                    />

                    <circle
                        cx="12"
                        cy="12"
                        r="2.5"
                        stroke-width="1.7"
                    />
                `;

            }

        }

    </script>

</body>

</html>
