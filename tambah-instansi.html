    <script>

        /* =====================================================
           FORM TAMBAH INSTANSI
        ====================================================== */

        document
            .getElementById("formInstansi")
            .addEventListener("submit", function (e) {

                e.preventDefault();

                const data =
                    JSON.parse(
                        localStorage.getItem("accessInstansi")
                    ) || [];


                const newInstansi = {

                    id: Date.now(),

                    nama:
                        document
                            .getElementById("nama")
                            .value
                            .trim(),

                    kota:
                        document
                            .getElementById("kota")
                            .value
                            .trim(),

                    jenis:
                        document
                            .getElementById("jenis")
                            .value,

                    periode:
                        document
                            .getElementById("periode")
                            .value,

                    status:
                        document
                            .getElementById("status")
                            .value
                };


                data.push(newInstansi);


                localStorage.setItem(
                    "accessInstansi",
                    JSON.stringify(data)
                );


                window.location.href = "instansi.html";

            });


        /* =====================================================
           DROPDOWN ADMINISTRATOR
        ====================================================== */

        const profileToggle =
            document.getElementById("profileToggle");

        const profileDropdown =
            document.getElementById("profileDropdown");

        const profileChevron =
            document.getElementById("profileChevron");


        /* Default dropdown TERTUTUP */
        profileDropdown.classList.remove("show");


        /* Klik Administrator */
        profileToggle.addEventListener("click", function (e) {

            e.stopPropagation();

            const isOpen =
                profileDropdown.classList.contains("show");


            if (isOpen) {

                profileDropdown.classList.remove("show");

                profileChevron.classList.remove("rotate-180");

            } else {

                profileDropdown.classList.add("show");

                profileChevron.classList.add("rotate-180");

            }

        });


        /* Klik di luar Administrator */
        document.addEventListener("click", function (e) {

            if (
                !profileDropdown.contains(e.target) &&
                !profileToggle.contains(e.target)
            ) {

                profileDropdown.classList.remove("show");

                profileChevron.classList.remove("rotate-180");

            }

        });


        /* =====================================================
           LOGOUT
        ====================================================== */

        document
            .getElementById("logoutButton")
            .addEventListener("click", function () {

                const confirmLogout =
                    confirm("Yakin ingin keluar dari akun?");

                if (confirmLogout) {

                    window.location.href = "index.html";

                }

            });

    </script>
