                0 2px 8px rgba(38, 55, 80, 0.04),
                0 1px 2px rgba(38, 55, 80, 0.03);

        .menu-item {
            transition: all 0.2s ease;

        .menu-item:hover {
            background: #EFFAF4;
            color: #008A4B;

        .menu-active {

        ::-webkit-scrollbar-track {

        }

        ::-webkit-scrollbar-thumb {

            border-radius: 10px;

</head>


<body class="text-slate-600">

               top-0

               w-[220px]

               border-slate-200

               flex-col">


        <!-- LOGO -->

        <div
            class="h-[78px]
                   px-5
                   flex

                   border-b
                   border-slate-200
                   shrink-0">

            <div class="flex items-center gap-3 min-w-0">

                <img
                    src="assets/images/logo.png"
                    alt="Logo Access Media"
                    class="w-11 h-11 object-contain shrink-0">

                <div class="min-w-0">

                    <h1
                        class="text-[13px]
                               font-bold
                               text-navy
                               whitespace-nowrap">

                    <p
                        class="text-[10px]

                    </p>

                </div>

            </div>

        </div>


        <!-- MENU -->

        <nav

                   py-5

            <p

                       mb-3
                       text-[9px]
                       font-semibold
                       uppercase
                       tracking-[0.12em]
                       text-slate-400">

                Menu Utama

            </p>


            <!-- DASHBOARD -->

            <a

                       flex
                       items-center
                       gap-3

                       py-2.5
                       rounded-lg
                       text-xs
                       text-slate-500
                       font-medium
                       mb-1">

                <svg
                    class="w-4 h-4"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24">

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="1.8"
                        d="M4 4h6v6H4V4Zm10 0h6v6h-6V4ZM4 14h6v6H4v-6Zm10 0h6v6h-6v-6Z"/>

                </svg>

                Dashboard

            </a>


            <!-- KEGIATAN -->

            <a
                href="kegiatan.html"
                class="menu-item
                       flex
                       items-center
                       gap-3
                       px-3
                       py-2.5
                       rounded-lg
                       text-xs
                       text-slate-500
                       mb-1">

                <svg
                    class="w-4 h-4"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24">

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="1.8"
                        d="M8 7V3m8 4V3M4 11h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z"/>

                </svg>

                Kegiatan

            </a>


            <!-- PROJECT -->

            <a
                href="project.html"
                class="menu-item
                       flex
                       items-center
                       gap-3

                       py-2.5

                <svg
                    class="w-4 h-4"

                    <path

                </svg>

            <!-- DOKUMENTASI -->

            <a

                class="menu-item
                       flex

                       px-3
                       py-2.5
                       rounded-lg

                       text-slate-500
                       mb-1">

                <svg
                    class="w-4 h-4"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24">

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="1.8"
                        d="M5 4h14v16H5V4Zm3 4h8m-8 4h8m-8 4h5"/>

                </svg>

                Dokumentasi

            </a>


            <!-- INSTANSI -->

            <a
                href="instansi.html"
                class="menu-item
                       menu-active
                       flex
                       items-center
                       gap-3
                       px-3
                       py-2.5
                       rounded-lg
                       text-xs
                       font-semibold">

                <svg
                    class="w-4 h-4"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24">

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="1.8"
                        d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/>

                </svg>

                Instansi

            </a>

        </nav>


        <!-- USER -->

        <div
            class="p-4
                   border-t
                   border-slate-200
                   shrink-0">

            <div
                class="flex
                       items-center
                       gap-3
                       p-2
                       rounded-lg
                       hover:bg-slate-50
                       transition">

                <div
                    class="w-8
                           h-8
                           rounded-full
                           bg-gradient-to-br
                           from-green-100
                           to-purple-100
                           flex
                           items-center
                           justify-center">

                    <span
                        class="text-[11px]
                               font-bold
                               text-green-700">

                        A

                    </span>

                </div>


                <div
                    class="min-w-0
                           flex-1">

                    <p
                        class="text-[11px]
                               font-semibold
                               text-navy
                               truncate">

                        Administrator

                    </p>

                    <p
                        class="text-[9px]
                               text-slate-400">

                        Admin

                    </p>

                </div>

            </div>

        </div>

    </aside>



    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main
        class="ml-[220px]
               min-h-screen">


        <!-- =================================================
             NAVBAR
        ================================================== -->

        <header
            class="sticky
                   top-0
                   z-40
                   h-[78px]
                   bg-white/95
                   backdrop-blur-md
                   border-b
                   border-slate-200
                   px-7
                   flex
                   items-center
                   justify-between">

            <div>

                <h2
                    class="text-[17px]
                           font-bold
                           text-navy">

                    Tambah Instansi

                </h2>

                <p
                    class="text-[11px]
                           text-slate-400
                           mt-0.5">

                    Tambahkan mitra baru Access Internship

                </p>

            </div>


            <a
                href="instansi.html"
                class="px-3.5
                       py-2
                       rounded-lg
                       bg-green-600
                       hover:bg-green-700
                       text-white
                       text-[10px]
                       font-semibold
                       transition">

                ← Kembali

            </a>

        </header>



        <!-- =================================================
             CONTENT
        ================================================== -->

        <div
            class="dashboard-bg
                   min-h-[calc(100vh-78px)]
                   p-5">


            <!-- FORM CARD -->

            <section
                class="max-w-5xl
                       mx-auto
                       bg-white
                       rounded-2xl
                       border
                       border-slate-200
                       soft-shadow
                       overflow-hidden">


                <!-- FORM HEADER -->

                <div
                    class="px-6
                           py-5
                           border-b
                           border-slate-200">

                    <div
                        class="flex
                               items-center
                               gap-2">

                        <span
                            class="w-2.5
                                   h-2.5
                                   rounded-full
                                   bg-green-500">
                        </span>

                        <h2
                            class="text-[15px]
                                   font-bold
                                   text-navy">

                            Informasi Instansi

                        </h2>

                    </div>


                    <p
                        class="text-[10px]
                               text-slate-400
                               mt-1
                               ml-[18px]">

                        Isi data instansi yang akan menjadi mitra internship.

                    </p>

                </div>



                <!-- FORM -->

                <form
                    id="formInstansi"
                    class="p-7">


                    <div
                        class="grid
                               grid-cols-1
                               md:grid-cols-2
                               gap-5">


                        <!-- NAMA -->

                        <div
                            class="md:col-span-2">

                            <label
                                class="block
                                       text-[10px]
                                       font-semibold
                                       text-navy
                                       mb-1.5">

                                Nama Instansi

                            </label>

                            <input
                                id="nama"
                                type="text"
                                required
                                placeholder="Contoh: SMK Negeri 3 Banjar"
                                class="w-full
                                       px-3
                                       py-2.5
                                       rounded-lg
                                       border
                                       border-slate-200
                                       text-[10px]
                                       outline-none
                                       focus:border-green-500
                                       focus:ring-2
                                       focus:ring-green-100">

                        </div>



                        <!-- KOTA -->

                        <div>

                            <label
                                class="block
                                       text-[10px]
                                       font-semibold
                                       text-navy
                                       mb-1.5">

                                Kota / Kabupaten

                            </label>

                            <input
                                id="kota"
                                type="text"
                                required
                                placeholder="Contoh: Kota Banjar"
                                class="w-full
                                       px-3
                                       py-2.5
                                       rounded-lg
                                       border
                                       border-slate-200
                                       text-[10px]
                                       outline-none
                                       focus:border-green-500
                                       focus:ring-2
                                       focus:ring-green-100">

                        </div>



                        <!-- JENIS -->

                        <div>

                            <label
                                class="block
                                       text-[10px]
                                       font-semibold
                                       text-navy
                                       mb-1.5">

                                Jenis Instansi

                            </label>

                            <select
                                id="jenis"
                                required
                                class="w-full
                                       px-3
                                       py-2.5
                                       rounded-lg
                                       border
                                       border-slate-200
                                       text-[10px]
                                       bg-white
                                       outline-none
                                       focus:border-green-500
                                       focus:ring-2
                                       focus:ring-green-100">

                                <option value="">
                                    Pilih jenis instansi
                                </option>

                                <option value="Sekolah">
                                    Sekolah
                                </option>

                                <option value="Perguruan Tinggi">
                                    Perguruan Tinggi
                                </option>

                            </select>

                        </div>



                        <!-- PERIODE -->

                        <div>

                            <label
                                class="block
                                       text-[10px]
                                       font-semibold
                                       text-navy
                                       mb-1.5">

                                Periode Kerja Sama

                            </label>

                            <input
                                id="periode"
                                type="number"
                                value="2026"
                                required
                                class="w-full
                                       px-3
                                       py-2.5
                                       rounded-lg
                                       border
                                       border-slate-200
                                       text-[10px]
                                       outline-none
                                       focus:border-green-500
                                       focus:ring-2
                                       focus:ring-green-100">

                        </div>



                        <!-- STATUS -->

                        <div>

                            <label
                                class="block
                                       text-[10px]
                                       font-semibold
                                       text-navy
                                       mb-1.5">

                                Status

                            </label>

                            <select
                                id="status"
                                class="w-full
                                       px-3
                                       py-2.5
                                       rounded-lg
                                       border
                                       border-slate-200
                                       text-[10px]
                                       bg-white
                                       outline-none
                                       focus:border-green-500
                                       focus:ring-2
                                       focus:ring-green-100">

                                <option value="Aktif">
                                    Aktif
                                </option>

                                <option value="Tidak Aktif">
                                    Tidak Aktif
                                </option>

                            </select>

                        </div>

                    </div>



                    <!-- BUTTON -->

                    <div
                        class="flex
                               justify-end
                               gap-2.5
                               mt-5
                               pt-4
                               border-t
                               border-slate-100">

                        <a
                            href="instansi.html"
                            class="px-3.5
                                   py-2
                                   rounded-lg
                                   border
                                   border-slate-200
                                   text-[10px]
                                   font-semibold
                                   text-slate-500
                                   hover:bg-slate-50
                                   transition">

                            Batal

                        </a>


                        <button
                            type="submit"
                            class="px-3.5
                                   py-2
                                   rounded-lg
                                   bg-green-600
                                   hover:bg-green-700
                                   text-white
                                   text-[10px]
                                   font-semibold
                                   transition">

                            Simpan Instansi

                        </button>

                    </div>

                </form>

            </section>

        </div>

    </main>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>

        document
            .getElementById("formInstansi")
            .addEventListener("submit", function(e) {

                e.preventDefault();


                const data =
                    JSON.parse(
                        localStorage.getItem("accessInstansi")
                    ) || [];


                const newInstansi = {

                    id: Date.now(),

                    nama:
                        document
                            .getElementById("nama")
                            .value
                            .trim(),

                    kota:
                        document
                            .getElementById("kota")
                            .value
                            .trim(),

                    jenis:
                        document
                            .getElementById("jenis")
                            .value,

                    periode:
                        document
                            .getElementById("periode")
                            .value,

                    status:
                        document
                            .getElementById("status")
                            .value

                };


                data.push(newInstansi);


                localStorage.setItem(
                    "accessInstansi",
                    JSON.stringify(data)
                );


                window.location.href =
                    "instansi.html";

            });

    </script>

</body>

</html>
